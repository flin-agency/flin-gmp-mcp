name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run twine check dist/*.whl dist/*.tar.gz
      - name: Build desktop package and check release version
        run: uv run python scripts/build_mcpb.py --tag "$GITHUB_REF_NAME"
      - name: Audit locked dependencies and attach review
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/audit-requirements.txt" --no-deps --disable-pip --require-hashes --format json --output dist/mcpb/dependency-audit.json
          cp SECURITY.md dist/mcpb/SECURITY-REVIEW.md
      - run: uv run python scripts/check_mcpb.py dist/mcpb/flin-gmp-mcp.mcpb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-bundle
          path: dist/mcpb/*
  desktop-verify:
    needs: build
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-bundle
          path: desktop-bundle
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_mcpb.py desktop-bundle/flin-gmp-mcp.mcpb
  publish-pypi:
    needs: [build, desktop-verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flin-gmp-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  verify-pypi-update:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-bundle
          path: desktop-bundle
      - run: uv sync --locked --extra dev
      - name: Download an existing installed-extension baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.4 --repo "$GITHUB_REPOSITORY" --pattern '*.mcpb' --dir previous-desktop-bundle
      - name: Require current PyPI server from both new and older bundles
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run python scripts/check_mcpb.py desktop-bundle/flin-gmp-mcp.mcpb --auto-update --preserve-settings --expected-version "${GITHUB_REF_NAME#v}" &&
               uv run python scripts/check_mcpb.py previous-desktop-bundle/*.mcpb --auto-update --preserve-settings --expected-version "${GITHUB_REF_NAME#v}"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
  github-release:
    needs: [build, verify-pypi-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-bundle
          path: desktop-bundle
      - name: Publish downloadable macOS extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop-bundle/* \
            --verify-tag --title "flin GMP MCP $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
